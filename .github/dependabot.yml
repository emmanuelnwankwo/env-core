version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: '09:00'
      timezone: Africa/Lagos
    allow:
      - dependency-name: dotenv
    versioning-strategy: increase
    open-pull-requests-limit: 1
    assignees:
      - emmanuelnwankwo
    commit-message:
      prefix: 'chore(deps)'
